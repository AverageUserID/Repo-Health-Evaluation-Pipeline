name: 'package_health'
version: '1.0.0'
profile: 'package_health'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  package_health:
    # Staging is a thin typed view over raw: no stored copy, always matches raw.
    staging:
      +materialized: view
    # Facts and marts are computed once per build (JSON parsing, medians) and read
    # repeatedly by Tasks 4-6. dbt rebuilds them with create-or-replace every build.
    marts:
      +materialized: table

vars:
  # Start of the analysis window. The flow passes the same value Task 1 used
  # (PIPELINE_START) so dev runs on a shorter window stay consistent.
  window_start: '2024-01-01T00:00:00Z'
  # Repos to analyze. The flow passes the same list Task 1 fetched (PIPELINE_REPOS),
  # so a repo with missing data shows up as zeros instead of disappearing.
  repos: ['scikit-learn/scikit-learn', 'dask/dask', 'plotly/plotly.py']
